
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="100%" stop-color="#05101f"/>
    </linearGradient>
    <radialGradient id="point" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Fond -->
  <rect width="1200" height="800" fill="url(#bg3)"/>
  
  <!-- Titre haut -->
  <text x="60" y="80" font-family="Poppins, Arial, sans-serif" font-size="32" font-weight="700" fill="#C9A227">LOU AME TAY 🐘</text>
  <text x="60" y="120" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#FFFFFF" opacity="0.75">Déploiements et assistance sur l'axe Thiès — Dakar — Mbour</text>
  
  <!-- Carte stylisée du Sénégal (contour géographique stylisé) -->
  <path d="M 230 220 Q 380 180 540 210 Q 690 240 840 230 Q 940 220 980 270 Q 1030 340 980 440 Q 930 540 830 590 Q 680 640 530 620 Q 380 600 280 560 Q 180 510 160 420 Q 140 330 180 260 Z" 
        fill="#1a3a5f" stroke="#C9A227" stroke-width="3" opacity="0.85" filter="url(#shadow3)"/>
  
  <!-- Point DAKAR -->
  <circle cx="260" cy="360" r="70" fill="url(#point)" opacity="0.4"/>
  <circle cx="260" cy="360" r="18" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/>
  <text x="260" y="325" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#FFFFFF">DAKAR</text>
  <text x="260" y="405" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#C9A227">Plateau • Almadies</text>
  
  <!-- Point THIÈS (Siège opérationnel) -->
  <circle cx="410" cy="390" r="70" fill="url(#point)" opacity="0.4"/>
  <circle cx="410" cy="390" r="22" fill="#EAB308" stroke="#FFFFFF" stroke-width="3"/>
  <text x="410" y="350" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#C9A227">★ THIÈS</text>
  <text x="410" y="435" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">Bureaux &amp; Atelier</text>
  
  <!-- Point MBOUR / SALY -->
  <circle cx="490" cy="490" r="70" fill="url(#point)" opacity="0.4"/>
  <circle cx="490" cy="490" r="18" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/>
  <text x="490" y="455" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#FFFFFF">MBOUR</text>
  <text x="490" y="535" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#C9A227">Saly Portudal</text>
  
  <!-- Lignes de connexion dorées en pointillés -->
  <line x1="260" y1="360" x2="410" y2="390" stroke="#C9A227" stroke-width="3" stroke-dasharray="10,5"/>
  <line x1="410" y1="390" x2="490" y2="490" stroke="#C9A227" stroke-width="3" stroke-dasharray="10,5"/>
  
  <!-- Panneau WhatsApp Support à droite -->
  <rect x="760" y="290" width="370" height="210" rx="20" fill="#FFFFFF" filter="url(#shadow3)"/>
  <rect x="785" y="315" width="60" height="60" rx="30" fill="#25D366"/>
  <text x="815" y="357" font-family="Poppins, Arial, sans-serif" font-size="34" text-anchor="middle" fill="#FFFFFF">💬</text>
  
  <text x="860" y="340" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="800" fill="#0B1F3A">Support WhatsApp</text>
  <text x="860" y="365" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748B">7j/7 de 08h00 à 20h00</text>
  
  <rect x="785" y="395" width="320" height="50" rx="10" fill="#F1F5F9"/>
  <text x="945" y="428" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#C9A227">+221 76 231 20 03</text>
  <text x="945" y="475" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#059669">⚡ Dépannage &amp; assistance express</text>
  
  <!-- Texte bas -->
  <text x="60" y="740" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700" fill="#C9A227">Interventions terrain 7j/7 sur tout l'axe sénégalais</text>
</svg>