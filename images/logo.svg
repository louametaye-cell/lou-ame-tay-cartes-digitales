<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE08B" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#C9A227" />
      <stop offset="100%" stop-color="#8C6D12" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122744" />
      <stop offset="100%" stop-color="#071426" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#C9A227" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fond circulaire avec bordure dorée -->
  <circle cx="40" cy="40" r="37" fill="url(#darkBg)" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#glow)"/>
  
  <!-- Anneau pointillé d'orfèvrerie -->
  <circle cx="40" cy="40" r="32" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3,2.5" opacity="0.85"/>

  <!-- Monogramme LAT officiel Lou Ame Tay -->
  <text x="40" y="48" font-family="'Playfair Display', 'Cinzel', Georgia, serif" font-size="22" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1.5">LAT</text>
  
  <!-- Cloche / Étoile dorée décorative -->
  <circle cx="40" cy="20" r="2" fill="url(#goldGrad)" />
</svg>
